name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: "SongList.getSongInfo (20)"
        id: getsonginfo
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "SongList.getSongInfo"
          setup-command: ''
          command: sh .github/grade.sh GetSongInfoTest
          timeout: 5
          max-score: 20
      - name: "SongList.updateDownloads (30)"
        id: updatedownloads
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "SongList.updateDownloads"
          setup-command: ''
          command: sh .github/grade.sh UpdateDownloadsTest
          timeout: 5
          max-score: 30
      - name: "ReviewCollection.addReview (20)"
        id: addreview
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "ReviewCollection.addReview"
          setup-command: ''
          command: sh .github/grade.sh AddReviewTest
          timeout: 5
          max-score: 20
      - name: "ReviewCollection.getNumGoodReviews (30)"
        id: getnumgoodreviews
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "ReviewCollection.getNumGoodReviews"
          setup-command: ''
          command: sh .github/grade.sh GetNumGoodReviewsTest
          timeout: 5
          max-score: 30
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          GETSONGINFO_RESULTS: "${{ steps.getsonginfo.outputs.result }}"
          UPDATEDOWNLOADS_RESULTS: "${{ steps.updatedownloads.outputs.result }}"
          ADDREVIEW_RESULTS: "${{ steps.addreview.outputs.result }}"
          GETNUMGOODREVIEWS_RESULTS: "${{ steps.getnumgoodreviews.outputs.result }}"
        with:
          runners: getsonginfo,updatedownloads,addreview,getnumgoodreviews
